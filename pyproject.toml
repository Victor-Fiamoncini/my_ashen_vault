[project]
name = "ashen-vault"
version = "0.1.0"
description = "A first-person dungeon crawler with procedural PS1-style graphics"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["raylib>=5.5"]

[project.scripts]
ashen-vault = "ashen_vault.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=6",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ashen_vault"]

# --- Lint & format ----------------------------------------------------------

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # flake8-bugbear
    "UP",       # pyupgrade
    "SIM",      # flake8-simplify
    "C4",       # flake8-comprehensions
    "RUF",      # ruff-specific
]
ignore = [
    "E501",     # line length is enforced by `ruff format`; long strings are left alone
    "E741",     # short names like `l` are natural in the math-heavy render code
    "SIM108",   # ternaries are not always clearer
    "RUF001",   # unicode glyphs in UI strings are intentional
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

# --- Tests & coverage -------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["ashen_vault"]
branch = true

[tool.coverage.report]
fail_under = 33      # current level; raise it as world.py, dialogue.py etc. gain tests
show_missing = true
skip_covered = true
exclude_also = ["if __name__ == .__main__.:"]
